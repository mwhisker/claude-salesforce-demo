# Ruff configuration for Python linting and formatting
# Documentation: https://docs.astral.sh/ruff/

# Line length (match Black's default)
line-length = 88

# Use 4 spaces for indentation (Python standard)
indent-width = 4

[lint]
# Enable recommended rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules if needed
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude specific files/directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
]

[format]
# Use double quotes
quote-style = "double"

# Use spaces instead of tabs
indent-style = "space"
